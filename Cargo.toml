[package]
name = "finn_monitor_scraper"
version = "0.1.0"
edition = "2021"
description = "Lightweight, safety-first CLI scraper monitoring FINN.no 'Skjermer' listings in Oslo."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "gzip"] }
scraper = "0.18"
rand = "0.8"
regex = "1"
